{% extends 'core/base.html' %}

{% block title %}Login — StreakKeeper{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="display-6 mb-2">🔥</div>
                    <h1 class="h3 fw-bold mb-1">Welcome back</h1>
                    <p class="text-muted small mb-0">Log in to keep your streaks alive.</p>
                </div>
                <form method="post" class="sk-form">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="id_username" name="username"
                               placeholder="Your username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="id_password" name="password"
                               placeholder="Your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Log In</button>
                </form>
                <p class="text-center text-muted small mt-4 mb-0">
                    New here? <a href="{% url 'register' %}" class="fw-semibold">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
