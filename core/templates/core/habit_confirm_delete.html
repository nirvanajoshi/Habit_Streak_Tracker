{% extends 'core/base.html' %}

{% block title %}Delete Habit — StreakKeeper{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card shadow-sm text-center">
            <div class="card-body p-4 p-md-5">
                <div class="display-6 mb-3">🗑️</div>
                <h1 class="h4 fw-bold mb-2">Delete "{{ habit.name }}"?</h1>
                <p class="text-muted small mb-4">
                    This will permanently delete this habit and all of its check-ins.
                    This action cannot be undone.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2">
                        <button type="submit" class="btn btn-danger px-4 fw-semibold">Yes, Delete</button>
                        <a href="{% url 'habit_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
